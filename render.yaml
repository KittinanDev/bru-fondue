services:
  - type: web
    name: bru-fondue
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npx next build
    startCommand: npx prisma db push --skip-generate && npx tsx scripts/ensure-db.ts && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/tmp/bru-fondue.db
